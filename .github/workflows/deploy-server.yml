# Builds the server image, pushes it to Artifact Registry and deploys it to Cloud Run.
# Runs on every push to main that touches the server, and on demand. Every value comes from the
# `production` GitHub environment's variables and secrets.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/server
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Written as YAML so a value may hold any character; --set-env-vars splits on commas.
      - name: Write runtime environment
        run: |
          cat > "$RUNNER_TEMP/env.yaml" <<'YAML'
          NODE_ENV: "production"
          DB_URL: "${{ secrets.DB_URL }}"
          FIREBASE_AUTH_BASE_64: "${{ secrets.FIREBASE_AUTH_BASE_64 }}"
          PRIVATE_API_KEY: "${{ secrets.PRIVATE_API_KEY }}"
          PRIVATE_API_EMAIL: "${{ vars.PRIVATE_API_EMAIL }}"
          AWS_ACCESS_KEY: "${{ secrets.AWS_ACCESS_KEY }}"
          AWS_SECRET_KEY: "${{ secrets.AWS_SECRET_KEY }}"
          AWS_REGION: "${{ vars.AWS_REGION }}"
          S3_BUCKET_NAME: "${{ vars.S3_BUCKET_NAME }}"
          S3_PUBLIC_BUCKET_NAME: "${{ vars.S3_PUBLIC_BUCKET_NAME }}"
          S3_PREFIX: "${{ vars.S3_PREFIX }}"
          SENDGRID_API_KEY: "${{ secrets.SENDGRID_API_KEY }}"
          RAZORPAY_API_KEY: "${{ secrets.RAZORPAY_API_KEY }}"
          RAZORPAY_WEBHOOK_SECRET: "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}"
          RAZORPAY_SIGNATURE_SECRET: "${{ secrets.RAZORPAY_SIGNATURE_SECRET }}"
          YAML

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE:${{ github.sha }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi --concurrency 80 --cpu-boost \
            --min-instances 1 --max-instances 5 \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "Deployed $URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/health"
          echo "### Server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
